[project]
name = "judgment-engine"
version = "0.1.0"
description = "Can software reliably reproduce expert operational judgment?"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
llm = [
    "anthropic>=0.30",
]

[project.scripts]
judgment = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
