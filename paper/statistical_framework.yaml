# PropBench Statistical Framework
# Confidence intervals, sample sizes, and significance testing

## 1. Confidence Intervals for Baseline Scores

# For proportion-based metrics (recall, precision), use Wilson score interval.
# Formula: p̂ ± z * sqrt(p̂(1-p̂)/n + z²/(4n²)) / (1 + z²/n)
# Where z = 1.96 for 95% CI

# Current dataset: 268 entries, 1223 consequence files

baselines:
  file_predictor:
    metric: "file-level recall"
    point_estimate: 0.08
    n: 1223  # total consequence files scored
    ci_95: [0.06, 0.10]  # Wilson interval
    interpretation: "We are 95% confident true recall is between 6% and 10%"
    
  historian:
    metric: "file-level recall"
    point_estimate: 0.25
    n: 1223
    ci_95: [0.22, 0.28]
    interpretation: "True recall between 22% and 28%"
    
  pattern_oracle:
    metric: "package-level recall"
    point_estimate: 0.55
    n: 268  # entries (package-level)
    ci_95: [0.49, 0.61]
    interpretation: "True recall between 49% and 61%"
    
  ensemble:
    metric: "package-level recall"
    point_estimate: 0.82
    n: 268
    ci_95: [0.77, 0.86]
    interpretation: "True recall between 77% and 86%"

## 2. Minimum Sample Size Requirements

# For a meaningful comparison between two baselines:
# Use McNemar's test (paired proportions on same dataset)
# 
# To detect a 10% difference in recall with:
#   - α = 0.05 (significance level)
#   - β = 0.80 (power)
#   - Estimated discordant pairs: ~20% of entries
#
# Required: n ≥ (z_α + z_β)² / (2 * |p1 - p2|²) ≈ 80 entries per category

minimum_samples:
  per_difficulty_category:
    required: 30  # minimum for normal approximation to hold
    current:
      trivial: 45   # ✅ sufficient
      easy: 72      # ✅ sufficient
      medium: 89    # ✅ sufficient
      hard: 48      # ✅ sufficient
      expert: 14    # ❌ insufficient (need 16 more)
    action: "Need 16 more 'expert' difficulty entries for significance"
    
  per_contract_type:
    required: 30
    current:
      openapi: 98    # ✅
      protobuf: 62   # ✅
      graphql: 38    # ✅
      database: 45   # ✅
      asyncapi: 25   # ❌ insufficient (need 5 more)
    action: "Need 5 more AsyncAPI entries for per-contract significance"
    
  per_source_type:
    required: 30
    current:
      industrial_mined: 241  # ✅
      industrial_curated: 16 # ❌ insufficient
      oss: 26                # ❌ insufficient (need 4 more)
    action: "OSS needs 4 more entries; curated needs 14 more (or merge with mined)"

  human_baseline:
    required_participants: 10  # minimum for stable mean estimate
    required_per_group: 3      # minimum per experience group
    groups: ["same-team", "adjacent-team", "external"]
    action: "Need at least 3 participants per group (9 total minimum)"

## 3. Significance Testing Plan

tests:
  - name: "Ensemble vs Human"
    test: "Paired t-test on per-entry F1 scores"
    hypothesis: "Ensemble recall > average human recall on blind prediction"
    required_n: 30  # entries where both human and ensemble have predictions
    
  - name: "Historian vs FilePredictor"
    test: "McNemar's test (paired binary outcomes)"
    hypothesis: "Historian finds more correct targets than FilePredictor"
    required_n: 80  # entries with discordant results
    current_n: 268  # ✅ sufficient
    
  - name: "Industrial vs OSS"
    test: "Mann-Whitney U (non-parametric, different sample sizes)"
    hypothesis: "Baseline performance does not differ between industrial and OSS"
    required_n: 30  # per group
    current_n_industrial: 257  # ✅
    current_n_oss: 26         # ❌ borderline (need 4 more)
    
  - name: "Decomposability"
    test: "Pearson correlation between channel predictions"
    hypothesis: "Channels are independent (r < 0.3)"
    required_n: 50  # entries where all 3 channels make predictions
    metric: "If r < 0.3, channels add unique information"

