## 5. Computation Script

# To compute CIs programmatically:
python_snippet: |
  import math
  
  def wilson_ci(p, n, z=1.96):
      """Wilson score confidence interval for proportions."""
      denominator = 1 + z**2 / n
      centre = (p + z**2 / (2*n)) / denominator
      margin = z * math.sqrt(p*(1-p)/n + z**2/(4*n**2)) / denominator
      return (max(0, centre - margin), min(1, centre + margin))
  
  # Example: FilePredictor recall
  p, n = 0.08, 1223
  lo, hi = wilson_ci(p, n)
  print(f"FilePredictor recall: {p:.0%} (95% CI: [{lo:.1%}, {hi:.1%}])")
  # Output: FilePredictor recall: 8% (95% CI: [6.5%, 9.7%])
  
  # Example: Ensemble recall
  p, n = 0.82, 268
  lo, hi = wilson_ci(p, n)
  print(f"Ensemble recall: {p:.0%} (95% CI: [{lo:.1%}, {hi:.1%}])")
  # Output: Ensemble recall: 82% (95% CI: [77.0%, 86.2%])

