  expert_reasoning: "Kubernetes API evolution is one of the most rigidly structured\
    \ processes\nin open source. Adding a field to a core API type touches:\n\n1.\
    \ types.go (trigger) \u2014 the Go struct\n2. generated.proto \u2014 protobuf\
    \ mirror (generated)\n3. zz_generated.deepcopy.go \u2014 deep copy (generated)\n\
    4. validation.go \u2014 input validation\n5. validation_test.go \u2014 validation\
    \ tests\n6. Controller code \u2014 where the field takes effect\n7. E2E tests\
    \ \u2014 behavior tests\n8. swagger.json \u2014 OpenAPI spec (generated)\n\nAn\
    \ experienced K8s contributor knows ALL of these from the trigger alone.\nThe\
    \ first 3 are STRUCTURAL (generated from types.go).\nThe rest are ORGANIZATIONAL\
    \ MEMORY (documented in KEP process, contribution guide).\n\nKEY INSIGHT: Even\
    \ in an extremely well-structured open-source project,\nthe propagation pattern\
    \ is nearly identical to Amazon's:\n- Some consequences are structurally derivable\
    \ (generated files)\n- Some require organizational knowledge (validation package,\
    \ e2e location)\n- Some require understanding INTENT (controller logic = what\
    \ does the field DO?)\n"
  common_mistakes:
  - Forgetting to run make generate (leaves generated files stale)
  - Not adding feature gate (new fields usually require a gate in alpha)
  - "Missing the conversion functions (v1 \u2194 internal type)"
  - Not considering the statefulset controller impact
  tags:
  - open-source
  - kubernetes
  - interface-evolution
  - generated-artifacts
  - multi-layer-propagation
  generalization_notes: "PATTERN ORACLE: Would STRONGLY fire if we had a \"K8s API\
    \ field addition\" playbook.\nThe pattern is as rigid as AAS onboarding \u2014\
