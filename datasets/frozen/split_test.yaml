- id: aas-onboarding-03
  title: Add LLM_DERIVED_V2 source for DELIVERY_HINT at BUILDING and UNIT level
  family: aas-onboarding
  date: '2026-07-24'
  author: aakkaash
  cr_ids:
  - CR-291722104
  - CR-291743376
  trigger:
    package: AIXAttributeConfigData
    version_set: AddressAuthorityServiceNext/release
    files:
    - configuration/attributes/DELIVERY_HINT.json
    intent: Add LLM_DERIVED_V2 as a source at BUILDING and UNIT level for US, with
      propagation from BUILDING down to UPIDs
    diff_summary: 'Added LLM_DERIVED_V2 to three config sections:

      - propagationConfig: US BUILDING + CAMPUS entries

      - selectionConfig.sourceWhitelist: US BUILDING + US UNIT entries

      - strategyConfigEntry: US BUILDING + US UNIT entries

      Each follows exact same structure as existing WELLSPRING entries.

      '
  consequences:
  - package: GAMCoreModel
    version_set: AddressAuthorityServiceNext/release
    files:
    - configuration/SourceConfiguration.prototxt
    description: Add PROPAGATED.BUILDING.LLM_DERIVED_V2 and PROPAGATED.CAMPUS.LLM_DERIVED_V2
      source entries
    mechanical: true
    relationship: structural
    confidence_an_expert_would_predict: 0.98
    reasoning: Runtime requires PROPAGATED.X.SOURCE registry entries for propagation
      to function. Without this, the AIX config change silently does nothing.
  - package: AteamIntegrationTests
    version_set: ATEAMIntegTest/release
    files:
    - tst/com/amazon/aas/integration/DeliveryHintLlmDerivedV2Test.java
    description: Integration test validating the new source resolves correctly end-to-end
    mechanical: false
    relationship: co-change
    confidence_an_expert_would_predict: 0.85
    reasoning: "Every source onboarding historically includes an integ test. Not structurally\
      \ required but always done. Different VS complicates \u2014 junior engineers\
      \ miss this."
  - package: AASTypesCoral
    version_set: AASTypesCoral/release
    files: []
    description: "Coral model type sync \u2014 historically lags 3-6 months after\
      \ main onboarding"
    mechanical: true
    relationship: co-change
    optional: true
    lag: 3-6 months
    confidence_an_expert_would_predict: 0.45
    reasoning: AASTypesCoral syncs eventually but is never part of the initial CR
      set. Knowing this prevents wasted time trying to include it.
  expert_reasoning: "1. Pattern recognition: WELLSPRING (Sep 2025) and GLOBAL_STORE\
    \ both touched\n   exactly AIXAttributeConfigData + GAMCoreModel + AteamIntegrationTests.\n\
    2. Structural knowledge: SourceConfiguration.prototxt is the runtime registry.\n\
    \   If a source isn't registered there, propagation config is dead code.\n3. Process\
    \ knowledge: AteamIntegrationTests is on a DIFFERENT version set\n   (ATEAMIntegTest/release),\
    \ requiring a separate CR. Juniors try to put\n   everything in one CR and get\
    \ confused when the build fails.\n4. Temporal knowledge: AASTypesCoral always\
    \ comes months later. Experienced\n   engineers know not to block on it.\n"
  common_mistakes:
  - "Forgetting GAMCoreModel \u2014 change deploys but propagation silently fails\
    \ at runtime with no error"
  - "Trying to put AteamIntegrationTests in the same CR as AIXAttributeConfigData\
    \ \u2014 different VS"
  - "Including AASTypesCoral in scope \u2014 causes unnecessary delays"
  - Copying WELLSPRING pattern but not adapting level (BUILDING vs UNIT) correctly
  difficulty: medium
  required_knowledge:
  - historical_pattern
  - dependency_graph
  - domain_semantics
  not_required:
  - runtime_behavior
  - ownership
  - deployment_topology
  tags:
  - multi-package
  - config-driven
  - pattern-repeating
  - cross-version-set
  - silent-failure-if-missed
  effort:
    actual_hours: 16
    mechanical_hours: 4
    review_hours: 8
    packages_touched: 3
    crs_raised: 2
- id: config-changes-01
  title: Remove US from GeoRaven geocode-ingestion-config
  family: config-changes
  date: '2026-06-15'
  author: aakkaash
  cr_ids:
  - CR-285750479
  trigger:
    package: CSGAndGCSIntegrationLambdaGeo
    version_set: CustomerSourcedGeocodes/release
    files:
    - configuration/geocode-ingestion-config.json
    intent: Disable GeoRaven geocode ingestion for US market
    diff_summary: 'Removed the US country block from geocode-ingestion-config.json

      to stop GeoRaven from processing US geocodes.

      '
  consequences:
  - package: CSGAndGCSIntegrationLambdaGeo
    version_set: CustomerSourcedGeocodes/release
    files:
    - configuration/geocode-ingestion-config.json
    description: "PlacesGeoRaven invoker ALSO reads this config and still fires for\
      \ US \u2014 removing the US block broke PlacesGeoRaven, not just GeoRaven"
    mechanical: false
    relationship: structural
    confidence_an_expert_would_predict: 0.3
    reasoning: This is tribal knowledge. The config file is shared by MULTIPLE invokers
      (GeoRaven AND PlacesGeoRaven). Only someone who knows the full invocation graph
      would predict this.
    surprise: true
  expert_reasoning: "This is a FAILURE CASE \u2014 the expert (me) did NOT predict\
    \ this correctly.\n\nThe config file geocode-ingestion-config.json is consumed\
    \ by multiple\nLambda invokers within the same package:\n- GeoRaven (the one we\
    \ wanted to disable for US)\n- PlacesGeoRaven (which still needs US config)\n\n\
    Removing the US block disabled BOTH invokers. The correct fix was to\nadd a per-invoker\
    \ gate, not remove the country block.\n\nThis is interesting because:\n1. Static\
    \ analysis of imports would show both invokers read the same config\n2. But the\
    \ INTENT (\"disable GeoRaven for US\") doesn't map cleanly to\n   \"remove config\
    \ block\" because of the shared-config pattern\n3. A prediction engine that understood\
    \ multi-invoker patterns would have\n   flagged this as risky\n"
  common_mistakes:
  - Assuming a config file is consumed by only one invoker
  - Not checking ALL Lambda handlers in a multi-handler package before changing shared
    config
  - Removing a country block instead of adding a per-invoker disable flag
  - Leaving orphaned config that confuses future readers
  difficulty: expert
  required_knowledge:
  - runtime_behavior
  - deployment_topology
  - ownership
  not_required:
  - historical_pattern
  - dependency_graph
  misleading_signals:
  - "dependency_graph suggests only GeoRaven reads the config (wrong \u2014 PlacesGeoRaven\
    \ does too)"
  tags:
  - single-package
  - config-driven
  - multi-invoker-pattern
  - expert-got-it-wrong
  - hidden-coupling
  - SURPRISE
  effort:
    actual_hours: 8
    mechanical_hours: 1
    debug_hours: 6
    packages_touched: 1
    crs_raised: 1
  notes: 'THIS IS THE MOST VALUABLE TYPE OF ENTRY.


    It represents a case where even the expert made the wrong prediction.

    The engine should eventually be BETTER than the expert here by doing

    exhaustive static analysis that humans skip.


    Key research question: Can the Architect strategy (static analysis of

    who reads this config file) catch this even when the Historian and

    Pattern Matcher cannot?

    '
- id: integration-tests-01
  title: Add DefectLifecycleTest Coral API integration tests
  family: integration-tests
  date: '2026-07-13'
  author: aakkaash
  cr_ids:
  - CR-288852323
  trigger:
    package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - tst/com/amazon/rdms/integration/DefectLifecycleTest.java
    intent: Add integration tests covering CreateDefect, GetDefect, UpdateDefect,
      GetDefectsByFingerprint Coral APIs
    diff_summary: "New test class with 4 chained methods (priority + dependsOnMethods):\n\
      testCreateDefect \u2192 testGetDefect \u2192 testUpdateDefect \u2192 testGetDefectsByFingerprint.\n\
      Uses fresh random addressId + trackingId per run. No pre-seeded data.\n"
  consequences:
  - package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - configuration/testng-development.xml
    description: "TestNG XML needs new test class registered (local only \u2014 Hydra\
      \ injects its own)"
    mechanical: true
    relationship: structural
    confidence_an_expert_would_predict: 0.7
    reasoning: "TestNG XML must reference new test classes. But this is local-only\
      \ config \u2014 Hydra pipeline uses its own config. Easy to forget when running\
      \ locally."
  expert_reasoning: 'This is a MINIMAL propagation case. Adding a test class to an
    existing

    test package requires almost no other changes.


    The only "propagation" is the TestNG XML file which registers the test

    for local execution. In Hydra (CI), tests are discovered automatically.


    The expert knows:

    1. No Config file changes needed (SQS SDK was already present)

    2. No build dependency changes (Coral client already in the package)

    3. testng-development.xml is local-only and NOT committed to mainline

    4. Hydra uses qualifier=Base.NA.Beta.NAWS, not the local qualifier

    '
  common_mistakes:
  - Committing testng-development.xml with local qualifier (breaks Hydra)
  - Using qualifier=beta.us-east-1 in Hydra CLI (causes endpoint resolution failure)
  - Running development-integ-tests without running release first (SSLHandshakeException)
  - "Assuming DHS is reachable from beta Lambda VPC (it's not \u2014 DNS resolution\
    \ fails)"
  tags:
  - single-package
  - minimal-propagation
  - test-addition
  - runtime-gotchas
  effort:
    actual_hours: 8
    mechanical_hours: 2
    review_hours: 4
    packages_touched: 1
    crs_raised: 1
  notes: "Another negative/minimal case. The engine should predict very little\ndownstream\
    \ propagation for adding a test to an existing test package.\n\nThe real complexity\
    \ here isn't propagation \u2014 it's RUNTIME gotchas\n(DHS DNS, qualifier format,\
    \ TLS truststore). Those are a different\nkind of expert knowledge that the prediction\
    \ engine might not capture,\nbut they're valuable to document for the \"what did\
    \ the expert know?\" corpus.\n"
- id: integration-tests-02
  title: Add DefectEventProcessorLambda SQS integration test
  family: integration-tests
  date: '2026-07-16'
  author: aakkaash
  cr_ids:
  - CR-289673698
  trigger:
    package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - tst/com/amazon/rdms/integration/DefectEventProcessorLambdaTest.java
    intent: Add Lambda integration test that sends SQS message to trigger DefectEventProcessorLambda
      and verifies DDB state changes
    diff_summary: "New test class with 2 chained methods:\ntestDefectEventCreatePath\
      \ (sends SQS CREATE event) \u2192\ntestDefectEventUpdatePath (sends SQS UPDATE\
      \ event, verifies timestamp change).\nUses parameterized queue URL. Fresh random\
      \ addressId + trackingId.\n"
  consequences:
  - package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - Config
    description: Add AwsJavaSdk-Sqs = 2.0 dependency to Brazil Config file
    mechanical: true
    relationship: structural
    confidence_an_expert_would_predict: 0.85
    reasoning: SQS SendMessage requires the SDK. If the test imports SqsClient, the
      package needs the dependency. Build will fail without it.
  - package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - configuration/testng-development.xml
    description: Register new test class + add defectEventQueueUrl parameter
    mechanical: true
    relationship: structural
    confidence_an_expert_would_predict: 0.7
    reasoning: TestNG XML needs test class registration and @Parameters declaration
      for the queue URL.
  expert_reasoning: "Unlike DefectLifecycleTest (pure Coral API calls), this Lambda\
    \ test needs\nSQS SDK to send messages. That triggers a BUILD dependency change.\n\
    \nThe expert recognizes:\n1. New import (software.amazon.awssdk.services.sqs)\
    \ \u2192 Config file needs the dep\n2. SQS queue URL is environment-specific \u2192\
    \ parameterize via TestNG XML\n3. Lambda processes asynchronously \u2192 need\
    \ sleep/retry logic in test assertions\n4. CREATE path blocked in beta (DHS DNS\
    \ issue) \u2192 only UPDATE path works\n\nThe prediction here is: changing test\
    \ code that imports a NEW SDK\nrequires a Config dependency addition. That's a\
    \ structural prediction\nthe Architect strategy should catch.\n"
  common_mistakes:
  - Forgetting to add SQS dependency to Config (import exists but build fails)
  - Hardcoding queue URL instead of parameterizing (breaks across environments)
  - Not realizing CREATE path is blocked in beta (DHS DNS ticket pending)
  - Running development-integ-tests after clean without release first (TLS truststore
    missing)
  tags:
  - single-package
  - dependency-addition
  - test-addition
  - build-dependency-propagation
  effort:
    actual_hours: 12
    mechanical_hours: 3
    review_hours: 4
    packages_touched: 1
    crs_raised: 1
  notes: "Contrasts with integration-tests-01 (DefectLifecycleTest). That one had\n\
    NO Config change needed because Coral client SDK was already present.\nThis one\
    \ DOES need a Config change because SQS is a new dependency.\n\nThe engine should\
    \ learn: \"new import that doesn't exist in current deps \u2192\nConfig file needs\
    \ updating.\" That's a structural signal the Architect\nstrategy can detect by\
    \ comparing imports against existing Config entries.\n"
