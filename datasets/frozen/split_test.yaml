- id: cdk-infrastructure-01
  title: Grant Wellspring Orchestrator cross-account SNS subscribe access
  family: cdk-infrastructure
  date: '2026-07-10'
  author: aakkaash
  cr_ids: []
  trigger:
    package: GeoStudioDeliveryHistoryCDK
    version_set: GeoStudioBackend/release
    files:
    - lib/configProvider.ts
    - lib/snsPolicyProvider.ts
    intent: Allow WellspringOrchestrator account (739951718670) to subscribe to DeliveryHistoryDDBEventSNS
      topic for Building Summary signals 2 and 4
    diff_summary: 'configProvider.ts: added getWellspringOrchestratorAWSAccountId()
      returning

      ''739951718670'' for GAMMA, undefined for others.

      snsPolicyProvider.ts: conditionally adds Wellspring principal to SNS topic policy.

      '
  consequences:
  - package: WellspringOrchestratorCDK
    version_set: WellspringOrchestrator/development
    files:
    - lib/triggerStack.ts
    description: Create SQS queue + SNS subscription in Wellspring account to receive
      events
    mechanical: false
    relationship: structural
    confidence_an_expert_would_predict: 0.8
    reasoning: "Granting access is only half \u2014 the consumer side needs a queue\
      \ + subscription. Cross-account SNS always has two sides."
  - package: WellspringTriggers
    version_set: WellspringOrchestrator/development
    files:
    - building-summary-trigger/src/main/java/BuildingSummaryTriggerHandler.java
    description: Lambda handler code to process the SNS events from DHS topic
    mechanical: false
    relationship: co-change
    confidence_an_expert_would_predict: 0.6
    reasoning: "The CDK grant enables the data flow, but the processing code needs\
      \ to exist too. Less obvious as 'propagation' \u2014 more like 'the other half\
      \ of the feature'."
  expert_reasoning: 'Cross-account SNS access is ALWAYS a two-sided change:

    1. Producer side: add principal to SNS topic policy (this trigger)

    2. Consumer side: create SQS queue + SNS subscription + Lambda handler


    The expert knows this because cross-account messaging never works with

    just one side. But these are in DIFFERENT packages on DIFFERENT version sets

    owned by DIFFERENT teams (DHS team vs Wellspring team).


    The tricky part: from the trigger alone (GeoStudioDeliveryHistoryCDK change),

    predicting that WellspringTriggers needs a new Lambda handler requires

    understanding the INTENT, not just the code change.

    '
  common_mistakes:
  - Only doing the producer side and forgetting the consumer subscription
  - Not realizing the consumer is in a different account/VS/team ownership
  - Creating subscription before the policy grant (deploy order matters)
  tags:
  - cross-account
  - cross-version-set
  - two-sided-change
  - infrastructure
  - intent-required
  effort:
    actual_hours: 4
    mechanical_hours: 2
    review_hours: 2
    packages_touched: 3
    crs_raised: 2
  notes: "This is an interesting case because predicting the consumer-side changes\n\
    requires understanding the INTENT (\"Building Summary needs to receive\ndelivery\
    \ events\") rather than just structural analysis. The Architect\nstrategy (dependency\
    \ graph) won't catch this \u2014 only the Reasoner or\nPattern Matcher (cross-account\
    \ SNS = two sides) would predict it.\n"
- id: integration-tests-02
  title: Add DefectEventProcessorLambda SQS integration test
  family: integration-tests
  date: '2026-07-16'
  author: aakkaash
  cr_ids:
  - CR-289673698
  trigger:
    package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - tst/com/amazon/rdms/integration/DefectEventProcessorLambdaTest.java
    intent: Add Lambda integration test that sends SQS message to trigger DefectEventProcessorLambda
      and verifies DDB state changes
    diff_summary: "New test class with 2 chained methods:\ntestDefectEventCreatePath\
      \ (sends SQS CREATE event) \u2192\ntestDefectEventUpdatePath (sends SQS UPDATE\
      \ event, verifies timestamp change).\nUses parameterized queue URL. Fresh random\
      \ addressId + trackingId.\n"
  consequences:
  - package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - Config
    description: Add AwsJavaSdk-Sqs = 2.0 dependency to Brazil Config file
    mechanical: true
    relationship: structural
    confidence_an_expert_would_predict: 0.85
    reasoning: SQS SendMessage requires the SDK. If the test imports SqsClient, the
      package needs the dependency. Build will fail without it.
  - package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - configuration/testng-development.xml
    description: Register new test class + add defectEventQueueUrl parameter
    mechanical: true
    relationship: structural
    confidence_an_expert_would_predict: 0.7
    reasoning: TestNG XML needs test class registration and @Parameters declaration
      for the queue URL.
  expert_reasoning: "Unlike DefectLifecycleTest (pure Coral API calls), this Lambda\
    \ test needs\nSQS SDK to send messages. That triggers a BUILD dependency change.\n\
    \nThe expert recognizes:\n1. New import (software.amazon.awssdk.services.sqs)\
    \ \u2192 Config file needs the dep\n2. SQS queue URL is environment-specific \u2192\
    \ parameterize via TestNG XML\n3. Lambda processes asynchronously \u2192 need\
    \ sleep/retry logic in test assertions\n4. CREATE path blocked in beta (DHS DNS\
    \ issue) \u2192 only UPDATE path works\n\nThe prediction here is: changing test\
    \ code that imports a NEW SDK\nrequires a Config dependency addition. That's a\
    \ structural prediction\nthe Architect strategy should catch.\n"
  common_mistakes:
  - Forgetting to add SQS dependency to Config (import exists but build fails)
  - Hardcoding queue URL instead of parameterizing (breaks across environments)
  - Not realizing CREATE path is blocked in beta (DHS DNS ticket pending)
  - Running development-integ-tests after clean without release first (TLS truststore
    missing)
  tags:
  - single-package
  - dependency-addition
  - test-addition
  - build-dependency-propagation
  effort:
    actual_hours: 12
    mechanical_hours: 3
    review_hours: 4
    packages_touched: 1
    crs_raised: 1
  notes: "Contrasts with integration-tests-01 (DefectLifecycleTest). That one had\n\
    NO Config change needed because Coral client SDK was already present.\nThis one\
    \ DOES need a Config change because SQS is a new dependency.\n\nThe engine should\
    \ learn: \"new import that doesn't exist in current deps \u2192\nConfig file needs\
    \ updating.\" That's a structural signal the Architect\nstrategy can detect by\
    \ comparing imports against existing Config entries.\n"
- id: integration-tests-03
  title: Add SQS SDK dependency for Lambda integration test
  family: dependency-evolution
  date: '2026-07-16'
  author: aakkaash
  cr_ids:
  - CR-289673698
  trigger:
    package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - tst/com/amazon/rdms/integration/DefectEventProcessorLambdaTest.java
    intent: "Write Lambda integ test that sends SQS messages \u2014 requires adding\
      \ SQS SDK that isn't currently a dependency"
    diff_summary: 'New test class importing software.amazon.awssdk.services.sqs.SqsClient.

      Sends SQS message to trigger Lambda, waits, verifies DDB state via Coral API.

      '
  consequences:
  - package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - Config
    description: Brazil Config must add AwsJavaSdk-Sqs = 2.0 (build fails without
      it)
    mechanical: true
    relationship: structural
    confidence_an_expert_would_predict: 0.9
    reasoning: "New import not in existing deps \u2192 build fails. Expert checks\
      \ Config immediately when adding new SDK usage."
  - package: RepeatDefectsManagementServiceTests
    version_set: RepeatDefectsManagementService/release
    files:
    - configuration/testng-development.xml
    description: TestNG XML needs new test class + @Parameters for queue URL (local
      dev only)
    mechanical: true
    relationship: structural
    confidence_an_expert_would_predict: 0.65
    reasoning: "TestNG requires class registration + parameter declaration. But this\
      \ is local-only config \u2014 Hydra injects its own."
  expert_reasoning: "This is a DEPENDENCY EVOLUTION case. The test code introduces\
    \ a new SDK\nimport that doesn't exist in the package's current dependencies.\n\
    \nThe expert's process:\n1. See new import (SqsClient) \u2192 check Config for\
    \ AwsJavaSdk-Sqs\n2. Not there \u2192 add it (AwsJavaSdk-Sqs = 2.0)\n3. TestNG:\
    \ register class + parameterize queue URL\n\nThis is structurally detectable:\
    \ new import \u2192 missing dep \u2192 Config change.\nAn AST-aware Structure\
    \ oracle could catch this perfectly.\n"
  common_mistakes:
  - Forgetting Config dep (import compiles in IDE with workspace deps but fails in
    brazil-build)
  - Hardcoding queue URL instead of parameterizing (breaks across environments)
  - Committing testng-development.xml with local qualifier (breaks Hydra)
  - Running integ-tests after clean without release first (TLS truststore missing)
  tags:
  - single-package
  - dependency-addition
  - build-dependency
  - structurally-detectable
  difficulty: easy
  required_knowledge:
  - dependency_graph
  - build_system_rules
  not_required:
  - historical_pattern
  - runtime_behavior
  - domain_semantics
  propagation_unit: file
  effort:
    actual_hours: 12
    mechanical_hours: 2
    packages_touched: 1
    crs_raised: 1
