expert_reasoning: |
  The terraform-provider-aws has an EXTREMELY well-documented contribution pattern:
  
  Adding a new argument to an existing resource ALWAYS requires:
  1. Schema definition in resource file (the trigger)
  2. Acceptance test (same service directory, _test.go suffix)
  3. Documentation (website/docs/r/ or website/docs/d/)
  4. Changelog entry (.changelog/<PR-number>.txt)
  
  This pattern is documented in:
  - https://github.com/hashicorp/terraform-provider-aws/blob/main/docs/add-a-new-resource.md
  - CONTRIBUTING.md
  - PR template
  
  An experienced Terraform contributor predicts ALL FOUR files from seeing
  only the schema change. This is pure PATTERN knowledge — identical to
  AAS source onboarding at Amazon.
  
  KEY INSIGHT: The pattern is ORGANIZATIONAL (documented in contribution guide),
  not structural (can't derive "needs changelog" from code structure alone).

common_mistakes:
