  intent: "Fix DHS client TLS handshake failure by making KeyMaster decryption optional and using domain-aware qualifier for DHS endpoint resolution"
  diff_summary: |
    KeyMasterUtils: made decryption optional (graceful fallback when KeyMaster unavailable)
    DeliveryHistoryServiceConfig: use domain-aware qualifier for endpoint resolution
    DeliveryHistoryManager: integrate DHS client with KeyMaster decryption flow

consequences:
