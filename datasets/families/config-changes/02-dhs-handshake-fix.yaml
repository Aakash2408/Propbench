  - package: "SmartAddressAssistantWebApp"
    version_set: "SmartAddressAssistantHorizonte/release"
    files:
      - "src/main/java/com/amazon/saa/delivery/DeliveryHistoryManager.java"
    description: "Manager class wiring DHS client with KeyMaster decryption"
    mechanical: false
    relationship: "structural"
    confidence_an_expert_would_predict: 0.85
    reasoning: "The manager is where the integration logic lives. KeyMasterUtils is just the utility — it needs a consumer."

expert_reasoning: |
  This is an INTRA-package propagation case. All 3 files are in the same
  package. The expert knows:
  1. KeyMasterUtils is a utility — it never works alone. There's always a
     Config (how to connect) and a Manager (how to use it).
  2. The DHS integration follows the same pattern as every other external
     service integration in SAA: Config → Client → Manager → API endpoint.
  3. Changing the Utils without updating the Manager means the fix doesn't
     actually reach the API call path.

common_mistakes:
